<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tarjeta Crema Mokaapeh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: una sola columna estrecha tipo billetera. Tarjeta de boleto con perforación,
   cuadrícula de sellos arriba y franja de premio abajo; acciones y ajustes fuera de la tarjeta. */
:root {
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  --bg: #EDEFF3;
  --fg: #141824;
  --muted: #586072;
  --panel: #FFFFFF;
  --line: #D3D8E1;
  --card: #172033;
  --card-fg: #F3F5F9;
  --card-muted: #A3AEC4;
  --slot-line: #43557A;
  --ink: #172033;
  --stamp: #F5B335;
  --danger: #B3261E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1017;
    --fg: #E9ECF2;
    --muted: #9AA3B5;
    --panel: #151A24;
    --line: #272E3C;
    --card: #1C2840;
    --card-fg: #F3F5F9;
    --card-muted: #A9B4CA;
    --slot-line: #4A5C84;
    --ink: #172033;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1017;
  --fg: #E9ECF2;
  --muted: #9AA3B5;
  --panel: #151A24;
  --line: #272E3C;
  --card: #1C2840;
  --card-fg: #F3F5F9;
  --card-muted: #A9B4CA;
  --slot-line: #4A5C84;
  --ink: #172033;
  --danger: #FF8A80;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: grid; gap: 16px; }
[hidden] { display: none !important; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.btn {
  font: 700 15px var(--font-body);
  min-height: 48px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1.5px solid transparent;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--stamp); color: var(--ink); }
.btn-primary:hover { filter: brightness(.96); }
.btn-secondary { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .swatch:focus-visible {
  outline: 3px solid var(--fg); outline-offset: 2px;
}

/* Tarjeta */
.card {
  background: var(--card);
  color: var(--card-fg);
  border-radius: 22px;
  padding: 22px 20px 0;
  box-shadow: 0 18px 40px -22px rgba(10, 16, 30, .55);
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.biz {
  font: 800 26px/1.05 var(--font-display);
  letter-spacing: -.01em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  min-width: 0;
  margin: 0;
}
.num { font: 400 12px/1.6 var(--font-mono); color: var(--card-muted); white-space: nowrap; }
.holder { margin: 6px 0 0; font-size: 13px; color: var(--card-muted); overflow-wrap: anywhere; }

.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  gap: 14px 8px;
  margin-top: 20px;
  padding-bottom: 24px;
}
.cell { display: grid; gap: 5px; justify-items: center; min-width: 0; }
.slot {
  width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center;
}
.slot.empty { border: 1.5px dashed var(--slot-line); font: 400 13px var(--font-mono); color: var(--card-muted); }
.slot.filled {
  background: var(--stamp);
  color: var(--ink);
  font: 800 clamp(18px, 5.5vw, 26px)/1 var(--font-display);
  box-shadow: inset 0 0 0 3px var(--stamp), inset 0 0 0 5px rgba(23, 32, 51, .38);
  transform: rotate(var(--rot, 0deg));
}
.date { font: 400 10px/1 var(--font-mono); color: var(--card-muted); height: 10px; white-space: nowrap; }

@keyframes pop {
  0% { transform: scale(1.7) rotate(-14deg); opacity: 0; }
  60% { transform: scale(.94) rotate(var(--rot, 0deg)); opacity: 1; }
  100% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
}
.slot.pop { animation: pop .38s cubic-bezier(.2, .8, .3, 1.2) both; }
@media (prefers-reduced-motion: reduce) { .slot.pop { animation: none; } }

.perf { position: relative; margin: 0 -20px; height: 0; }
.perf::before, .perf::after {
  content: ""; position: absolute; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
}
.perf::before { left: -11px; }
.perf::after { right: -11px; }
.perf span { position: absolute; left: 18px; right: 18px; top: -1px; border-top: 2px dashed var(--slot-line); }

.reward { display: flex; align-items: center; gap: 14px; padding: 20px 0 22px; }
.gift {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1.5px dashed var(--slot-line); color: var(--card-muted);
}
.reward.ready .gift { background: var(--stamp); border-color: var(--stamp); color: var(--ink); }
.reward-text { min-width: 0; }
.reward-t { font: 700 16px/1.25 var(--font-body); overflow-wrap: anywhere; }
.reward-s { font-size: 13px; color: var(--card-muted); }
.reward.ready .reward-s { color: var(--card-fg); }

/* Acciones */
.actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.pinbox, .panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
}
.pinbox form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pinbox label { flex-basis: 100%; font-weight: 700; }
.pinbox input { flex: 1 1 120px; }
.pinerr { margin: 8px 0 0; min-height: 1.2em; font-size: 13px; color: var(--danger); }

.note {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
  font-size: 13px; color: var(--muted);
  border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px;
}
.linkbtn { background: none; border: 0; padding: 0; font: 700 13px var(--font-body); color: var(--fg); text-decoration: underline; cursor: pointer; }
.status { min-height: 1.3em; margin: 0; font-size: 14px; font-weight: 500; }
.foot { margin: 0; font-size: 13px; color: var(--muted); }

/* Ajustes */
.panel { display: grid; gap: 14px; }
.panel h2 { margin: 0; font: 800 18px/1.2 var(--font-display); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .legend {
  font: 500 11px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
input[type="text"], input[type="password"], select {
  font: 400 16px var(--font-body);
  min-height: 44px; width: 100%; box-sizing: border-box;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px;
  background: var(--bg); color: var(--fg);
}
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c);
  box-shadow: inset 0 0 0 2px rgba(23, 32, 51, .25);
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--fg); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.help { margin: 0; font-size: 13px; color: var(--muted); }
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="eyebrow">Tarjeta de fidelidad</span>
  </div>

  <section class="card" aria-label="Tarjeta de sellos">
    <div class="card-head">
      <div style="min-width:0">
        <h1 class="biz" id="biz">Mi Negocio</h1>
        <p class="holder" id="holder" hidden></p>
      </div>
      <span class="num" id="num">N.º 0000</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="perf" aria-hidden="true"><span></span></div>
    <div class="reward" id="reward">
      <div class="gift" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/><path d="M12 8c-1.5-3-5-3.5-5-1.2C7 8 9 8 12 8zM12 8c1.5-3 5-3.5 5-1.2C17 8 15 8 12 8z"/></svg>
      </div>
      <div class="reward-text">
        <div class="reward-t" id="reward-t"></div>
        <div class="reward-s" id="reward-s"></div>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="btn btn-primary" id="add" type="button">Añadir sello</button>
    <button class="btn btn-secondary" id="undo" type="button">Quitar sello</button>
  </div>

  <div class="pinbox" id="pinbox" hidden>
    <form id="pinform" autocomplete="off">
      <label for="pin">PIN del negocio</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
      <button class="btn btn-primary btn-small" type="submit">Confirmar</button>
      <button class="btn btn-secondary btn-small" id="pincancel" type="button">Cancelar</button>
    </form>
    <p class="pinerr" id="pinerr" role="alert"></p>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <p class="foot" id="stats" hidden></p>
  <p class="foot">Los sellos se guardan en este dispositivo.</p>
</div>

<script>
(function () {
  var KEY = 'tarjeta-mokaapeh-v1';
  var cfg = { name: 'Crema Mokaapeh', reward: '1 crema de 15 onzas', holder: '', total: 6, pin: '1331', accent: '#F5B335' };
  var mem = null;

  function $(id) { return document.getElementById(id); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return mem;
  }
  function save() {
    mem = { cfg: cfg, state: state };
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {}
  }
  function daysAgo(n) { return new Date(Date.now() - n * 864e5).toISOString(); }
  function fmt(iso) {
    try {
      return new Date(iso).toLocaleDateString('es', { day: 'numeric', month: 'short' }).replace('.', '');
    } catch (e) { return ''; }
  }

  var saved = load();
  var isNew = !(saved && saved.state && Array.isArray(saved.state.stamps));
  var state = isNew
    ? { stamps: [new Date().toISOString()], redeemed: 0, num: String(Math.floor(Math.random() * 9000) + 1000) }
    : saved.state;
  if (state.stamps.length > cfg.total) state.stamps = state.stamps.slice(0, cfg.total);
  save();

  var justAdded = isNew ? 0 : -1;
  var pending = null;
  var statusTimer = null;
  var resetTimer = null;

  function say(msg) {
    var s = $('status');
    s.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { s.textContent = ''; }, 4000);
  }

  function render() {
    document.documentElement.style.setProperty('--stamp', cfg.accent);
    $('biz').textContent = cfg.name || 'Mi Negocio';
    $('num').textContent = 'N.º ' + state.num;
    var h = $('holder');
    h.textContent = cfg.holder ? 'Cliente: ' + cfg.holder : '';
    h.hidden = !cfg.holder;

    var n = cfg.total, got = state.stamps.length;
    var cols = n <= 6 ? 3 : n <= 8 ? 4 : n <= 10 ? 5 : 6;
    var grid = $('grid');
    grid.style.setProperty('--cols', cols);
    grid.textContent = '';
    var letter = ((cfg.name || 'M').trim().charAt(0) || 'M').toUpperCase();
    for (var i = 0; i < n; i++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var slot = document.createElement('div');
      var date = document.createElement('span');
      date.className = 'date';
      if (i < got) {
        slot.className = 'slot filled' + (i === justAdded ? ' pop' : '');
        slot.style.setProperty('--rot', (((i * 37) % 9) - 4) + 'deg');
        slot.textContent = letter;
        date.textContent = fmt(state.stamps[i]);
        slot.setAttribute('aria-label', 'Sello ' + (i + 1) + ' de ' + n + ', ' + fmt(state.stamps[i]));
      } else {
        slot.className = 'slot empty';
        slot.textContent = String(i + 1);
        slot.setAttribute('aria-label', 'Sello ' + (i + 1) + ' pendiente');
      }
      cell.appendChild(slot);
      cell.appendChild(date);
      grid.appendChild(cell);
    }
    justAdded = -1;

    var left = n - got, ready = left <= 0;
    var reward = cfg.reward || 'Premio';
    $('reward').classList.toggle('ready', ready);
    $('reward-t').textContent = ready ? '¡Premio listo! ' + reward : reward;
    $('reward-s').textContent = ready
      ? 'Muéstralo en caja para canjearlo.'
      : (left === 1 ? 'Te falta 1 sello' : 'Te faltan ' + left + ' sellos');

    $('add').textContent = ready ? 'Canjear premio' : 'Añadir sello';
    $('undo').disabled = got === 0;
    var st = $('stats');
    st.hidden = !(state.redeemed > 0);
    st.textContent = state.redeemed > 0 ? 'Premios canjeados: ' + state.redeemed : '';
  }

  function addStamp() {
    if (state.stamps.length >= cfg.total) return;
    state.stamps.push(new Date().toISOString());
    justAdded = state.stamps.length - 1;
    save(); render();
    var left = cfg.total - state.stamps.length;
    say(left <= 0 ? '¡Tarjeta completa! Ya se puede canjear el premio.' : 'Sello añadido. ' + (left === 1 ? 'Falta 1.' : 'Faltan ' + left + '.'));
  }
  function undoStamp() {
    if (!state.stamps.length) return;
    state.stamps.pop();
    save(); render();
    say('Último sello quitado.');
  }
  function redeem() {
    state.redeemed = (state.redeemed || 0) + 1;
    state.stamps = [];
    save(); render();
    say('Premio canjeado. Tarjeta nueva lista.');
  }

  function closePin() {
    pending = null;
    $('pinbox').hidden = true;
    $('pin').value = '';
    $('pinerr').textContent = '';
  }
  function guard(fn) {
    if (!cfg.pin) { fn(); return; }
    pending = fn;
    $('pinbox').hidden = false;
    $('pinerr').textContent = '';
    $('pin').value = '';
    $('pin').focus();
  }

  $('add').addEventListener('click', function () {
    guard(state.stamps.length >= cfg.total ? redeem : addStamp);
  });
  $('undo').addEventListener('click', function () { guard(undoStamp); });
  $('pinform').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('pin').value === cfg.pin) {
      var fn = pending;
      closePin();
      if (fn) fn();
    } else {
      $('pinerr').textContent = 'PIN incorrecto. Inténtalo de nuevo.';
      $('pin').select();
    }
  });
  $('pincancel').addEventListener('click', closePin);


  render();
})();
</script>
</body>
</html>
