<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Caja Mokaapeh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Pantalla de caja para el celular del negocio: entrar con PIN, buscar al cliente,
   ver su tarjeta y pulsar un solo botón grande. Mismo sistema visual que la tarjeta del cliente. */
:root {
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
  --bg: #EDEFF3;
  --fg: #141824;
  --muted: #586072;
  --panel: #FFFFFF;
  --line: #D3D8E1;
  --card: #172033;
  --card-fg: #F3F5F9;
  --card-muted: #A3AEC4;
  --slot-line: #43557A;
  --ink: #172033;
  --stamp: #F5B335;
  --danger: #B3261E;
  --ok: #1B6B3A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1017; --fg: #E9ECF2; --muted: #9AA3B5; --panel: #151A24; --line: #272E3C;
    --card: #1C2840; --card-fg: #F3F5F9; --card-muted: #A9B4CA; --slot-line: #4A5C84; --ink: #172033;
    --danger: #FF8A80; --ok: #7DDBA0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1017; --fg: #E9ECF2; --muted: #9AA3B5; --panel: #151A24; --line: #272E3C;
  --card: #1C2840; --card-fg: #F3F5F9; --card-muted: #A9B4CA; --slot-line: #4A5C84; --ink: #172033;
  --danger: #FF8A80; --ok: #7DDBA0;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; display: grid; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.btn {
  font: 700 16px var(--font-body);
  min-height: 52px; padding: 0 18px; border-radius: 14px; border: 1.5px solid transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
}
.btn-primary { background: var(--stamp); color: var(--ink); }
.btn-primary:hover { filter: brightness(.96); }
.btn-secondary { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-secondary:hover { border-color: var(--muted); }
.btn-small { min-height: 40px; width: auto; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, .result:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; display: grid; gap: 16px; }
.panel h1 { margin: 0; font: 800 26px/1.1 var(--font-display); letter-spacing: -.01em; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font: 500 11px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="password"], input[type="search"], select {
  font: 400 18px var(--font-body);
  min-height: 52px; width: 100%; box-sizing: border-box;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px;
  background: var(--bg); color: var(--fg);
}
.err { margin: 0; min-height: 1.2em; font-size: 14px; color: var(--danger); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.result {
  width: 100%; text-align: left; display: grid; gap: 2px; box-sizing: border-box;
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px 14px; min-height: 56px; cursor: pointer; color: var(--fg); font: inherit;
}
.result:hover { border-color: var(--muted); }
.result b { font-size: 17px; overflow-wrap: anywhere; }
.result span { font-size: 13px; color: var(--muted); }

.card { background: var(--card); color: var(--card-fg); border-radius: 22px; padding: 20px 20px 4px; box-shadow: 0 18px 40px -22px rgba(10, 16, 30, .55); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.who { margin: 0; font: 800 24px/1.1 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; text-wrap: balance; }
.tel { margin: 6px 0 0; font: 400 14px var(--font-mono); color: var(--card-muted); }
.num { font: 400 12px/1.6 var(--font-mono); color: var(--card-muted); white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px 8px; margin-top: 16px; }
.slot { width: 100%; max-width: 56px; justify-self: center; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.slot.empty { border: 1.5px dashed var(--slot-line); font: 400 13px var(--font-mono); color: var(--card-muted); }
.slot.filled {
  background: var(--stamp); color: var(--ink); font: 800 22px/1 var(--font-display);
  box-shadow: inset 0 0 0 3px var(--stamp), inset 0 0 0 5px rgba(23, 32, 51, .38);
}
.resumen { margin: 16px 0 0; padding: 14px 0 16px; border-top: 2px dashed var(--slot-line); display: grid; gap: 2px; }
.resumen b { font: 700 17px var(--font-body); }
.resumen span { font-size: 13px; color: var(--card-muted); }

.acciones { display: grid; gap: 10px; }
.status { min-height: 1.3em; margin: 0; font-size: 15px; font-weight: 700; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--danger); }

.top-btns { display: flex; gap: 8px; }
#s-pin-ok:empty { display: none; }
.panel h2 { margin: 0; font: 800 18px/1.2 var(--font-display); }
.legend { font: 500 11px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch {
  width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); padding: 0;
  box-shadow: inset 0 0 0 2px rgba(128, 128, 128, .45);
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--fg); }
.swatch:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.iconopt {
  width: 52px; height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg);
  cursor: pointer; padding: 0; display: grid; place-items: center; font: 700 17px var(--font-body);
}
.iconopt:hover { border-color: var(--muted); }
.iconopt[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--fg); }
.iconopt:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.card .grid { padding-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="eyebrow" id="eyebrow">Caja · Crema Mokaapeh</span>
    <div class="top-btns">
      <button class="btn btn-secondary btn-small" id="ajustes-btn" type="button" hidden>Personalizar</button>
      <button class="btn btn-secondary btn-small" id="salir" type="button" hidden>Salir</button>
    </div>
  </div>

  <section class="panel" id="a-login">
    <h1>Entrar a caja</h1>
    <form id="loginform" novalidate style="display:grid;gap:16px">
      <div class="field">
        <label for="a-pin">PIN</label>
        <input id="a-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
      </div>
      <p class="err" id="login-err" role="alert"></p>
      <button class="btn btn-primary" id="login-btn" type="submit">Entrar</button>
    </form>
  </section>

  <section id="a-main" hidden style="display:grid;gap:16px">
    <div class="field">
      <label for="q">Teléfono o nombre del cliente</label>
      <input id="q" type="search" autocomplete="off" placeholder="Ej. 9988 o Marcelo">
    </div>
    <p class="hint" id="hint">Escribe al menos 3 letras o números.</p>
    <ul class="results" id="results"></ul>

    <section id="detail" hidden style="display:grid;gap:16px">
      <div class="card">
        <div class="card-head">
          <div style="min-width:0">
            <h2 class="who" id="d-nombre"></h2>
            <p class="tel" id="d-tel"></p>
          </div>
          <span class="num" id="d-num"></span>
        </div>
        <div class="grid" id="d-grid"></div>
        <div class="resumen">
          <b id="d-sellos"></b>
          <span id="d-ultimo"></span>
        </div>
      </div>
      <div class="acciones">
        <button class="btn btn-primary" id="b-sellar" type="button">Añadir sello</button>
        <button class="btn btn-primary" id="b-canjear" type="button" hidden>Canjear premio</button>
        <button class="btn btn-secondary" id="b-quitar" type="button">Quitar sello</button>
        <button class="btn btn-secondary" id="b-editar" type="button">Corregir datos del cliente</button>
        <button class="btn btn-secondary" id="b-otro" type="button">Buscar otro cliente</button>
      </div>
      <form class="panel" id="editform" hidden novalidate>
        <h2>Corregir datos</h2>
        <div class="field">
          <label for="e-nombre">Nombre</label>
          <input id="e-nombre" type="text" maxlength="30" autocomplete="off">
        </div>
        <div class="field">
          <label for="e-apellido">Apellido</label>
          <input id="e-apellido" type="text" maxlength="30" autocomplete="off">
        </div>
        <div class="field">
          <label for="e-tel">Teléfono</label>
          <input id="e-tel" type="text" inputmode="tel" maxlength="20" autocomplete="off">
        </div>
        <p class="err" id="e-err" role="alert"></p>
        <button class="btn btn-primary" id="e-guardar" type="submit">Guardar cambios</button>
        <button class="btn btn-secondary" id="e-cancelar" type="button">Cancelar</button>
      </form>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="a-ajustes" hidden style="display:grid;gap:16px">
    <div class="card" id="s-prev" aria-label="Vista previa de la tarjeta">
      <div class="card-head"><h2 class="who" id="p-nombre"></h2></div>
      <div class="grid" id="p-grid"></div>
      <div class="resumen">
        <b id="p-premio"></b>
        <span>Así verán la tarjeta tus clientes</span>
      </div>
    </div>

    <div class="panel">
      <h2>Personalizar tarjeta</h2>
      <div class="field">
        <label for="s-negocio">Nombre del negocio</label>
        <input id="s-negocio" type="text" maxlength="28" autocomplete="off">
      </div>
      <div class="field">
        <label for="s-premio">Premio</label>
        <input id="s-premio" type="text" maxlength="40" autocomplete="off">
      </div>
      <div class="field">
        <label for="s-total">Sellos para el premio</label>
        <select id="s-total"></select>
      </div>
      <div class="field">
        <span class="legend" id="lg-color">Color de los sellos</span>
        <div class="swatches" id="s-colores" role="group" aria-labelledby="lg-color"></div>
      </div>
      <div class="field">
        <span class="legend" id="lg-tema">Color de la tarjeta</span>
        <div class="swatches" id="s-temas" role="group" aria-labelledby="lg-tema"></div>
      </div>
      <div class="field">
        <span class="legend" id="lg-icono">Logo del sello</span>
        <div class="swatches" id="s-iconos" role="group" aria-labelledby="lg-icono"></div>
      </div>
      <div class="field">
        <label for="s-letra">Letra del sello (si eliges Inicial)</label>
        <input id="s-letra" type="text" maxlength="1" autocomplete="off" style="max-width:96px;text-align:center">
      </div>
      <p class="err" id="s-err" role="alert"></p>
      <button class="btn btn-primary" id="s-guardar" type="button">Guardar cambios</button>
      <button class="btn btn-secondary" id="s-volver" type="button">Volver sin guardar</button>
    </div>

    <div class="panel">
      <h2>Cambiar PIN de caja</h2>
      <div class="field">
        <label for="s-pin">PIN nuevo (4 a 6 números)</label>
        <input id="s-pin" type="text" inputmode="numeric" maxlength="6" autocomplete="off">
      </div>
      <p class="err" id="s-pin-err" role="alert"></p>
      <p class="status ok" id="s-pin-ok" role="status"></p>
      <button class="btn btn-secondary" id="s-pin-btn" type="button">Cambiar PIN</button>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script>
(function () {
  var API = window.MOKAAPEH_API || '';
  var SKEY = 'mokaapeh-caja-pin';
  var pin = '';
  var sel = null;
  var busy = false;
  var seq = 0;
  var qTimer = null;
  var statusTimer = null;
  var conf = { negocio: 'Crema Mokaapeh', premio: '1 crema de 15 onzas', total: 6, color: '#F5B335', tema: 'azul', icono: 'inicial', letra: 'M' };
  var SV = '<svg viewBox="0 0 24 24" width="58%" height="58%" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var ICONS = {
    grano: SV + '<ellipse cx="12" cy="12" rx="6.3" ry="9" transform="rotate(35 12 12)"/><path d="M16.9 5.2c-3.3 2.5-.5 5.2-2.7 7.3-1.7 1.6-2.6 3.1-1.6 6.2"/></svg>',
    mancha: SV + '<path d="M15.8 6.6A7.6 7.6 0 1 0 18.5 15.4"/><path d="M12.6 9.6A4.4 4.4 0 1 0 15.3 14"/><circle cx="19.4" cy="8.3" r="1.15"/><circle cx="21" cy="11.9" r=".7"/><circle cx="18.6" cy="4.9" r=".6"/></svg>',
    taza: SV + '<path d="M5 10h11v4.5a4.5 4.5 0 0 1-4.5 4.5h-2A4.5 4.5 0 0 1 5 14.5z"/><path d="M16 11.2h1.6a2.4 2.4 0 0 1 0 4.8h-1.8"/><path d="M8.4 3.6c-.9 1.1.9 2 0 3.2M12 3.6c-.9 1.1.9 2 0 3.2"/><path d="M4 21.2h13"/></svg>',
    estrella: SV + '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>'
  };
  var ICON_OPTS = [['inicial', 'Inicial del negocio'], ['grano', 'Grano de café'], ['mancha', 'Mancha de taza'], ['taza', 'Taza'], ['estrella', 'Estrella']];
  function fillStamp(el, c) {
    var svg = ICONS[c.icono];
    if (svg) el.innerHTML = svg;
    else el.textContent = String(c.letra || (c.negocio || 'M').charAt(0)).toUpperCase();
  }
  var draft = null;
  var THEMES = {
    azul: null,
    espresso: { '--card': '#2A1C14', '--card-muted': '#BFAE9E', '--slot-line': '#6B5242' },
    bosque: { '--card': '#14301F', '--card-muted': '#A9C4B1', '--slot-line': '#3F6B50' },
    vino: { '--card': '#34121F', '--card-muted': '#D2AEBC', '--slot-line': '#7A3A55' },
    grafito: { '--card': '#20242B', '--card-muted': '#B2B8C2', '--slot-line': '#4C5562' }
  };
  var THEME_VARS = ['--card', '--card-muted', '--slot-line'];
  var COLORES = [['Azafrán', '#F5B335'], ['Coral', '#FF7A59'], ['Menta', '#4FD1A5'], ['Cielo', '#5BB5F5'], ['Rosa', '#F28DB2'], ['Lima', '#C5E063']];
  var TEMAS = [['azul', 'Azul noche', '#172033'], ['espresso', 'Espresso', '#2A1C14'], ['bosque', 'Bosque', '#14301F'], ['vino', 'Vino', '#34121F'], ['grafito', 'Grafito', '#20242B']];

  function $(id) { return document.getElementById(id); }
  function configured() { return /^https:\/\/script\.google\.com\//.test(API); }

  function api(body) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 25000);
    return fetch(API, { method: 'POST', body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(timer); return j; }, function (e) { clearTimeout(timer); throw e; });
  }

  function say(m, kind) {
    var s = $('status');
    s.textContent = m;
    s.className = 'status' + (kind ? ' ' + kind : '');
    clearTimeout(statusTimer);
    if (m && kind === 'ok') statusTimer = setTimeout(function () { s.textContent = ''; }, 6000);
  }
  function telTxt(t) {
    t = String(t);
    return t.length === 11 && t.indexOf('504') === 0 ? t.slice(3, 7) + ' ' + t.slice(7) : '+' + t;
  }
  function fechaHora(iso) {
    try {
      return new Date(iso).toLocaleString('es', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace('.', '');
    } catch (e) { return ''; }
  }
  function storePin(v) {
    try { if (v) sessionStorage.setItem(SKEY, v); else sessionStorage.removeItem(SKEY); } catch (e) {}
  }

  function showMain(on) {
    $('a-login').hidden = on;
    $('a-main').hidden = !on;
    $('salir').hidden = !on;
    $('ajustes-btn').hidden = !on;
    if (!on) { $('a-ajustes').hidden = true; $('editform').hidden = true; }
    if (on) loadConf();
  }
  function logout(msg) {
    pin = ''; sel = null; storePin('');
    $('a-pin').value = '';
    $('login-err').textContent = msg || '';
    $('results').textContent = '';
    $('q').value = '';
    $('detail').hidden = true;
    say('');
    showMain(false);
  }

  function renderDetail() {
    var c = sel, total = c.total || conf.total || 6;
    $('d-nombre').textContent = c.nombre + ' ' + c.apellido;
    $('d-tel').textContent = telTxt(c.telefono);
    $('d-num').textContent = 'N.º ' + c.numero;
    var grid = $('d-grid');
    grid.style.setProperty('--cols', total <= 6 ? 3 : total <= 8 ? 4 : total <= 10 ? 5 : 6);
    grid.textContent = '';
    for (var i = 0; i < total; i++) {
      var slot = document.createElement('div');
      if (i < c.sellos) { slot.className = 'slot filled'; fillStamp(slot, conf); }
      else { slot.className = 'slot empty'; slot.textContent = String(i + 1); }
      grid.appendChild(slot);
    }
    var completa = c.sellos >= total;
    $('d-sellos').textContent = c.sellos + ' de ' + total + ' sellos' + (c.canjeados ? ' · ' + c.canjeados + (c.canjeados === 1 ? ' premio canjeado' : ' premios canjeados') : '');
    var ult = c.fechas && c.fechas.length ? c.fechas[c.fechas.length - 1] : '';
    $('d-ultimo').textContent = ult ? 'Último sello: ' + fechaHora(ult) : 'Todavía sin sellos';
    $('b-sellar').hidden = completa;
    $('b-canjear').hidden = !completa;
    $('b-quitar').disabled = c.sellos === 0;
    $('editform').hidden = true;
    $('detail').hidden = false;
  }

  function setBusy(on) {
    busy = on;
    ['b-sellar', 'b-canjear', 'b-quitar', 'b-editar', 'b-otro'].forEach(function (id) { $(id).disabled = on || (id === 'b-quitar' && sel && sel.sellos === 0); });
  }

  function act(accion, okMsg) {
    if (busy || !sel) return;
    setBusy(true);
    say('Guardando…', '');
    api({ accion: accion, pin: pin, telefono: sel.telefono }).then(function (r) {
      setBusy(false);
      if (!r.ok) {
        if (r.pinMalo) { logout(r.error); return; }
        say(r.error || 'No se pudo guardar.', 'bad');
        renderDetail();
        return;
      }
      sel = r.cliente;
      renderDetail();
      say(okMsg(sel), 'ok');
    }, function () {
      setBusy(false);
      renderDetail();
      say('Sin conexión. No se guardó, inténtalo de nuevo.', 'bad');
    });
  }

  function buscar() {
    var q = $('q').value.trim();
    var mine = ++seq;
    if (q.length < 3) { $('results').textContent = ''; $('hint').textContent = 'Escribe al menos 3 letras o números.'; return; }
    $('hint').textContent = 'Buscando…';
    api({ accion: 'buscar', pin: pin, q: q }).then(function (r) {
      if (mine !== seq) return;
      if (!r.ok) {
        if (r.pinMalo) { logout(r.error); return; }
        $('hint').textContent = r.error || 'No se pudo buscar.';
        return;
      }
      var ul = $('results');
      ul.textContent = '';
      $('hint').textContent = r.clientes.length ? '' : 'No hay clientes con ese dato.';
      r.clientes.forEach(function (c) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'result';
        var n = document.createElement('b');
        n.textContent = c.nombre + ' ' + c.apellido;
        var s = document.createElement('span');
        s.textContent = telTxt(c.telefono) + ' · ' + c.sellos + ' de ' + (c.total || 6) + ' sellos';
        b.appendChild(n);
        b.appendChild(s);
        b.addEventListener('click', function () {
          sel = c;
          $('results').textContent = '';
          $('hint').textContent = '';
          say('');
          renderDetail();
          setBusy(false);
        });
        li.appendChild(b);
        ul.appendChild(li);
      });
    }, function () {
      if (mine !== seq) return;
      $('hint').textContent = 'Sin conexión. Inténtalo de nuevo.';
    });
  }

  $('q').addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(buscar, 400);
  });

  $('loginform').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var v = $('a-pin').value.trim();
    if (!v) { $('login-err').textContent = 'Escribe el PIN.'; return; }
    busy = true;
    $('login-btn').disabled = true;
    $('login-err').textContent = '';
    api({ accion: 'verificar', pin: v }).then(function (r) {
      busy = false;
      $('login-btn').disabled = false;
      if (!r.ok) { $('login-err').textContent = r.error || 'No se pudo entrar.'; $('a-pin').value = ''; return; }
      pin = v;
      storePin(v);
      $('a-pin').value = '';
      showMain(true);
      $('q').focus();
    }, function () {
      busy = false;
      $('login-btn').disabled = false;
      $('login-err').textContent = 'No hay conexión. Inténtalo de nuevo.';
    });
  });

  $('b-sellar').addEventListener('click', function () {
    act('sellar', function (c) { return c.sellos >= c.total ? 'Sello añadido. ¡Tarjeta completa! Ya puede canjear el premio.' : 'Sello añadido. Lleva ' + c.sellos + ' de ' + c.total + '.'; });
  });
  $('b-quitar').addEventListener('click', function () {
    act('quitar', function (c) { return 'Sello quitado. Lleva ' + c.sellos + ' de ' + c.total + '.'; });
  });
  $('b-canjear').addEventListener('click', function () {
    act('canjear', function () { return 'Premio canjeado. La tarjeta quedó en cero.'; });
  });
  $('b-otro').addEventListener('click', function () {
    sel = null;
    $('detail').hidden = true;
    say('');
    $('q').value = '';
    $('q').focus();
    $('hint').textContent = 'Escribe al menos 3 letras o números.';
  });
  $('salir').addEventListener('click', function () { logout(''); });

  /* ---------- Colores y ajustes ---------- */
  function paint(el, tema, color) {
    THEME_VARS.forEach(function (v) { el.style.removeProperty(v); });
    var t = THEMES[tema];
    if (t) Object.keys(t).forEach(function (k) { el.style.setProperty(k, t[k]); });
    el.style.setProperty('--stamp', color);
  }
  function paintRoot() {
    paint(document.documentElement, conf.tema, conf.color);
    $('eyebrow').textContent = 'Caja · ' + conf.negocio;
  }
  function loadConf() {
    api({ accion: 'config' }).then(function (r) {
      if (r && r.ok && r.config) {
        conf = r.config;
        paintRoot();
        if (sel) { sel.total = conf.total; renderDetail(); }
      }
    }, function () {});
  }

  function gridCols(n) { return n <= 6 ? 3 : n <= 8 ? 4 : n <= 10 ? 5 : 6; }
  function renderPreview() {
    paint($('s-prev'), draft.tema, draft.color);
    var nombre = draft.negocio.trim() || 'Tu negocio';
    $('p-nombre').textContent = nombre;
    $('p-premio').textContent = draft.premio.trim() || 'Tu premio';
    var g = $('p-grid');
    g.textContent = '';
    g.style.setProperty('--cols', gridCols(draft.total));
    for (var i = 0; i < draft.total; i++) {
      var s = document.createElement('div');
      if (i < 2) { s.className = 'slot filled'; fillStamp(s, { negocio: nombre, icono: draft.icono, letra: draft.letra }); }
      else { s.className = 'slot empty'; s.textContent = String(i + 1); }
      g.appendChild(s);
    }
  }
  function buildSwatches(box, items, current, onPick) {
    box.textContent = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.style.setProperty('--c', it.c);
      b.setAttribute('aria-label', it.name);
      b.setAttribute('aria-pressed', it.key === current ? 'true' : 'false');
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(box.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        onPick(it.key);
        renderPreview();
      });
      box.appendChild(b);
    });
  }
  function buildIcons(box, current, onPick) {
    box.textContent = '';
    ICON_OPTS.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'iconopt';
      b.setAttribute('aria-label', o[1]);
      b.setAttribute('aria-pressed', o[0] === current ? 'true' : 'false');
      if (ICONS[o[0]]) b.innerHTML = ICONS[o[0]]; else b.textContent = 'Aa';
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(box.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        onPick(o[0]);
        renderPreview();
      });
      box.appendChild(b);
    });
  }
  function openSettings() {
    draft = { negocio: conf.negocio, premio: conf.premio, total: conf.total, color: conf.color, tema: conf.tema, icono: conf.icono || 'inicial', letra: conf.letra || 'M' };
    $('s-negocio').value = draft.negocio;
    $('s-premio').value = draft.premio;
    $('s-letra').value = draft.letra;
    var sel2 = $('s-total');
    if (!sel2.children.length) {
      for (var n = 3; n <= 12; n++) {
        var o = document.createElement('option');
        o.value = String(n);
        o.textContent = n + ' sellos';
        sel2.appendChild(o);
      }
    }
    sel2.value = String(draft.total);
    buildSwatches($('s-colores'), COLORES.map(function (c) { return { key: c[1], name: c[0], c: c[1] }; }), draft.color, function (k) { draft.color = k; });
    buildSwatches($('s-temas'), TEMAS.map(function (t) { return { key: t[0], name: t[1], c: t[2] }; }), draft.tema, function (k) { draft.tema = k; });
    buildIcons($('s-iconos'), draft.icono, function (k) { draft.icono = k; });
    $('s-err').textContent = '';
    $('s-pin-err').textContent = '';
    $('s-pin-ok').textContent = '';
    $('s-pin').value = '';
    $('a-main').hidden = true;
    $('a-ajustes').hidden = false;
    renderPreview();
  }
  function closeSettings() {
    $('a-ajustes').hidden = true;
    $('a-main').hidden = false;
  }

  $('ajustes-btn').addEventListener('click', function () {
    if ($('a-ajustes').hidden) openSettings(); else closeSettings();
  });
  $('s-volver').addEventListener('click', closeSettings);
  $('s-negocio').addEventListener('input', function (e) { draft.negocio = e.target.value; renderPreview(); });
  $('s-premio').addEventListener('input', function (e) { draft.premio = e.target.value; renderPreview(); });
  $('s-letra').addEventListener('input', function (e) { draft.letra = e.target.value.trim().slice(0, 1).toUpperCase() || conf.letra || 'M'; renderPreview(); });
  $('s-total').addEventListener('change', function (e) { draft.total = parseInt(e.target.value, 10); renderPreview(); });

  $('s-guardar').addEventListener('click', function () {
    if (busy) return;
    var d = {
      negocio: $('s-negocio').value.trim(),
      premio: $('s-premio').value.trim(),
      total: parseInt($('s-total').value, 10)
    };
    if (d.negocio.length < 2) { $('s-err').textContent = 'Escribe el nombre del negocio.'; return; }
    if (d.premio.length < 2) { $('s-err').textContent = 'Escribe cuál es el premio.'; return; }
    $('s-err').textContent = '';
    busy = true;
    $('s-guardar').disabled = true;
    api({ accion: 'guardarAjustes', pin: pin, negocio: d.negocio, premio: d.premio, total: d.total, color: draft.color, tema: draft.tema, icono: draft.icono, letra: $('s-letra').value.trim() || conf.letra || 'M' }).then(function (r) {
      busy = false;
      $('s-guardar').disabled = false;
      if (!r.ok) {
        if (r.pinMalo) { logout(r.error); return; }
        $('s-err').textContent = r.error || 'No se pudo guardar.';
        return;
      }
      conf = r.config;
      paintRoot();
      if (sel) sel.total = conf.total;
      closeSettings();
      if (sel) renderDetail();
      say('Cambios guardados. Tus clientes los verán al actualizar su tarjeta.', 'ok');
    }, function () {
      busy = false;
      $('s-guardar').disabled = false;
      $('s-err').textContent = 'Sin conexión. No se guardó, inténtalo de nuevo.';
    });
  });

  $('s-pin-btn').addEventListener('click', function () {
    if (busy) return;
    var nuevo = $('s-pin').value.trim();
    $('s-pin-ok').textContent = '';
    if (!/^\d{4,6}$/.test(nuevo)) { $('s-pin-err').textContent = 'El PIN nuevo debe tener de 4 a 6 números.'; return; }
    $('s-pin-err').textContent = '';
    busy = true;
    api({ accion: 'cambiarPin', pin: pin, nuevoPin: nuevo }).then(function (r) {
      busy = false;
      if (!r.ok) {
        if (r.pinMalo) { logout(r.error); return; }
        $('s-pin-err').textContent = r.error || 'No se pudo cambiar el PIN.';
        return;
      }
      pin = nuevo;
      storePin(nuevo);
      $('s-pin').value = '';
      $('s-pin-ok').textContent = 'PIN cambiado. Anótalo en un lugar seguro.';
    }, function () {
      busy = false;
      $('s-pin-err').textContent = 'Sin conexión. Inténtalo de nuevo.';
    });
  });

  /* ---------- Corregir datos del cliente ---------- */
  $('b-editar').addEventListener('click', function () {
    if (!sel) return;
    var t = String(sel.telefono);
    $('e-nombre').value = sel.nombre;
    $('e-apellido').value = sel.apellido;
    $('e-tel').value = t.length === 11 && t.indexOf('504') === 0 ? t.slice(3) : t;
    $('e-err').textContent = '';
    $('editform').hidden = false;
    $('e-nombre').focus();
  });
  $('e-cancelar').addEventListener('click', function () { $('editform').hidden = true; });
  $('editform').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy || !sel) return;
    var nombre = $('e-nombre').value.trim();
    var apellido = $('e-apellido').value.trim();
    var nuevo = $('e-tel').value.trim();
    if (nombre.length < 2 || apellido.length < 2) { $('e-err').textContent = 'Escribe el nombre y el apellido.'; return; }
    if (nuevo.replace(/\D/g, '').length < 8) { $('e-err').textContent = 'Escribe un teléfono de 8 dígitos.'; return; }
    $('e-err').textContent = '';
    busy = true;
    $('e-guardar').disabled = true;
    api({ accion: 'editar', pin: pin, telefono: sel.telefono, nombre: nombre, apellido: apellido, nuevoTelefono: nuevo }).then(function (r) {
      busy = false;
      $('e-guardar').disabled = false;
      if (!r.ok) {
        if (r.pinMalo) { logout(r.error); return; }
        $('e-err').textContent = r.error || 'No se pudo guardar.';
        return;
      }
      var cambioTel = r.cliente.telefono !== sel.telefono;
      sel = r.cliente;
      renderDetail();
      say(cambioTel ? 'Datos corregidos. Dile al cliente que use el teléfono nuevo para recuperar su tarjeta.' : 'Datos corregidos.', 'ok');
    }, function () {
      busy = false;
      $('e-guardar').disabled = false;
      $('e-err').textContent = 'Sin conexión. No se guardó, inténtalo de nuevo.';
    });
  });

  if (!configured()) {
    $('login-err').textContent = 'Falta conectar con Google. Revisa el archivo config.js.';
    $('login-btn').disabled = true;
    return;
  }
  var saved = '';
  try { saved = sessionStorage.getItem(SKEY) || ''; } catch (e) {}
  if (saved) {
    api({ accion: 'verificar', pin: saved }).then(function (r) {
      if (r.ok) { pin = saved; showMain(true); } else { storePin(''); }
    }, function () {});
  }
})();
</script>
</body>
</html>
